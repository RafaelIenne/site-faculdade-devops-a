name: continuos-deployment
run-name: Deplyo do app

on: 
    push:
        branches:
            - main

jobs: 
    deploy:
        name: deploy
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Docker Login
              uses: docker/login-action@v3.4.0
              with:
                username: ${{secrets.DOCKER_USER }}
                password: ${{secrets.DOCKER_PASSWORD }}
            
            - name: Build and push Docker Image
              uses: docker/build-push-action@v6.15.0
              with:
                context: .
                file: ./Dockerfile
                push: true
                tag: fiqueisemnome/site-faculdade-latest:undefined

            - name: Azure App
              uses: Azure/webapps-deploy@v3.0.1
              with:
                app-name: aula-devops-2519853
                publich-profile: ${{secrets.PUBLISH_PROFILE }}
                image: fiqueisemnome/site-faculdade-latest:undefined